# Gradle JVM arguments for memory management
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable parallel execution to speed up builds (optional, can be removed if issues arise)
org.gradle.parallel=true

# Enable AndroidX and Jetifier for compatibility with older libraries
android.useAndroidX=true
android.enableJetifier=true

# Enable Gradle daemon (set to false if you still encounter issues with the daemon)
org.gradle.daemon=true

# Enable Gradle to avoid asking for build scans or reports during builds
org.gradle.configureondemand=true

# Enable Gradle's caching mechanism to improve incremental builds
org.gradle.caching=true

# Increase the number of worker threads for Gradle build
org.gradle.workers.max=4

# Enable Gradle to optimize the build and reduce memory usage when possible
org.gradle.parallel=true

# Optionally, you can set a specific Gradle version if you want to enforce a version (update based on your setup)
# gradle.wrapper.version=8.2.1

# Optional: For cleaner builds and faster APK size, you can enable code shrinking and resource shrinking:
# Uncomment the following line in the `build.gradle` if needed:
# buildTypes {
#     release {
#         shrinkResources true
#         minifyEnabled true
#     }
# }
